      <div class="col-md-3 mb-4">
        <div class="card technical-session-card text-center h-100" style="background: var(--card-bg); border: 2px solid var(--border-color); box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden;">
          <!-- Keynote Speaker Badge -->
          <div class="badge-container" style="background: #e0fbfc; color: var(--text-primary); padding: 10px 0; font-weight: bold; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border-color);">
            KEYNOTE SPEAKER
          </div>
          
          <div class="card-body d-flex flex-column align-items-center justify-content-center" style="background: var(--card-bg); margin: 0; padding: 30px 20px;">
            <img src="./images/matthew-tennyson.webp" alt="Dr. Matthew Tennyson" class="rounded-circle mb-3" style="width: 130px; height: 130px; object-fit: cover; border: 4px solid #3a506b; box-shadow: 0 4px 12px rgba(58, 80, 107, 0.4);">
            <h4 class="card-title font-weight-bold mb-2" style="color: var(--text-primary) !important; font-size: 1.3rem; font-family: Georgia, 'Times New Roman', Times, serif;">Dr. Matthew Tennyson</h4>
            <div class="title-badge" style="background: #e0fbfc; color: var(--text-primary); padding: 8px 20px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; border: 1px solid var(--border-color);">
              Professor & Department Chair
            </div>
            <div class="expertise-tag" style="background: var(--card-bg); color: var(--text-primary); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; border: 1px solid var(--border-color); font-weight: 500;">
              Computer Science & Information Systems<br>Murray State University, USA
            </div>
          </div>
        </div>
